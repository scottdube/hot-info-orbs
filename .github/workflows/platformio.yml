name: PlatformIO CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
          key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      # The build deliberately refuses to compile without BOTH config.h and
      # secrets.h, and rejects an unfilled key, so CI has to create both and
      # put something non-empty in the key fields. These are placeholders: CI
      # only ever compiles, it never calls the APIs.
      - name: Create config.h and secrets.h
        shell: bash
        working-directory: ./firmware
        run: |
          cp config/config.h.template config/config.h
          cp config/secrets.h.template config/secrets.h
          python - <<'PY'
          p = "config/secrets.h"
          s = open(p).read()
          s = s.replace('#define WEATHER_API_KEY ""',  '#define WEATHER_API_KEY "CI_BUILD_ONLY"')
          s = s.replace('#define TIMEZONE_API_KEY ""', '#define TIMEZONE_API_KEY "CI_BUILD_ONLY"')
          open(p, "w").write(s)
          PY

      - name: Build PlatformIO Project
        run: pio run
