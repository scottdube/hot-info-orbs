board_build.partitions = partitions.csv
; The app lives in app0, not at the first app offset: 0x10000 is the recovery
; app's `factory` partition, and a USB flash there would overwrite it.
; app_partition_name is what the size check measures against; without it
; PlatformIO measures the app against `factory` and fails at 195%.
board_upload.offset_address = 0xE0000
board_build.app_partition_name = app0
build_src_filter = +<*> -<recovery/>
extra_scripts = pre:tools/build_id.py
framework = arduino
lib_deps =
	SPI
	FS
	SPIFFS
	LittleFS
	SD
	arduino-libraries/NTPClient@^3.2.1
	bblanchon/ArduinoJson@^7.0.4
	bblanchon/StreamUtils@^1.9.0
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.1.0
	knolleary/PubSubClient@^2.8
	paulstoffregen/Time@^1.6.1
	tzapu/WiFiManager@^2.0.17
monitor_speed = 115200
build_flags = 
	; NOTE: do NOT add ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT here without
	; testing on hardware. Tried 2026-09-10: the app then claims the USB
	; peripheral, fails to enumerate, and the board vanishes from the host
	; entirely -- it still runs and stays on WiFi, but there is no port to
	; flash over and recovery needs manual bootloader entry. See docs/TRAPS.md.
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D USER_SETUP_LOADED=1
	-Wfatal-errors
	-I firmware/config
	-I firmware/src/core/button
	-I firmware/src/core/globaltime
	-I firmware/src/core/ota
	-I firmware/src/core/settings
	-I firmware/src/core/screenmanager
	-I firmware/src/core/utils
	-I firmware/src/core/widget
	-I firmware/src/core/wifi
	-I firmware/src/recovery
	-I firmware/src/widgets
	-include "firmware/config/config_helper.h"

; Network upload:  pio run -e ota -t upload --upload-port <orb IP>
; tools/ota_upload.py restarts the orb into recovery, uploads, and waits for
; the orbs to come back. It reads OTA_PASSWORD from secrets.h itself. Use the
; IP: .local lookups from the Mac were unreliable (docs/TRAPS.md).
; The first flash after the 2026-09-27 partition change must go over USB:
;   pio run -e recovery -t upload && pio run -e esp32-s3-devkitc-1 -t upload
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = custom
upload_port = info-orbs.local
upload_command = "$PYTHONEXE" tools/ota_upload.py $UPLOAD_PORT $SOURCE

; Recovery app in the `factory` partition (firmware/src/recovery). Takes a
; firmware upload over WiFi and writes app0. Has to fit 0xD0000 (851,968 B).
; USB only:  pio run -e recovery -t upload
[env:recovery]
platform = espressif32
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
board_build.app_partition_name = factory
framework = arduino
build_src_filter = -<*> +<recovery/>
extra_scripts = pre:tools/build_id.py
monitor_speed = 115200
build_flags =
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-Wfatal-errors
	-I firmware/config
	-include "firmware/config/config_helper.h"

; Host unit tests for pure logic (settings validation):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I firmware/src/recovery -I firmware/src/core/settings -I firmware/src/core/wifi -I firmware/src/widgets/weatherwidget
lib_deps = bblanchon/ArduinoJson@^7.0.4
