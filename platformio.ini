board_build.partitions = partitions.csv
extra_scripts = pre:tools/build_id.py
framework = arduino
lib_deps =
	SPI
	FS
	SPIFFS
	LittleFS
	SD
	arduino-libraries/NTPClient@^3.2.1
	bblanchon/ArduinoJson@^7.0.4
	bblanchon/StreamUtils@^1.9.0
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.1.0
	knolleary/PubSubClient@^2.8
	paulstoffregen/Time@^1.6.1
	tzapu/WiFiManager@^2.0.17
monitor_speed = 115200
build_flags = 
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D USER_SETUP_LOADED=1
	-Wfatal-errors
	-I firmware/config
	-I firmware/src/core/button
	-I firmware/src/core/globaltime
	-I firmware/src/core/ota
	-I firmware/src/core/settings
	-I firmware/src/core/screenmanager
	-I firmware/src/core/utils
	-I firmware/src/core/widget
	-I firmware/src/core/wifi
	-I firmware/src/widgets
	-include "firmware/config/config_helper.h"

; Network upload over ArduinoOTA:  pio run -e ota -t upload
; The first flash after the partition change must still go over USB.
; With OTA_PASSWORD set in secrets.h, add:  upload_flags = --auth=<password>
; Several orbs on one network: set OTA_HOSTNAME in config.h and match it here.
[env:ota]
extends = env:xiao-esp32s3
upload_protocol = espota
upload_port = info-orbs.local

; Dev-only: the v1.1 ESP32-S3 SuperMini prototype (4 MB flash), the orb Scott
; develops on until the XIAO carrier boards arrive. Same code, same config.h
; macros; only the board, the flash size and the 4 MB partition table differ.
; The pin map is the SuperMini one in your own (gitignored) config.h - the
; XIAO map blacks out screens 1-3 on it (docs/TRAPS.md, 2026-10-20). Not a
; supported build: the product is XIAO ESP32-S3 / S3 Plus only (2026-10-18).
; Over the air:  curl -F "firmware=@.pio/build/supermini-proto/firmware.bin" http://<orb>/update
; The update page then says "for supermini-proto".
[env:supermini-proto]
extends = env:xiao-esp32s3
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_build.partitions = partitions-4mb.csv

; Display edge test for enclosure design: patterns out to the rim on all five
; displays (firmware/src/displaytest/main.cpp). Standalone - no config.h, no
; Wi-Fi, no NVS - so it flashes the same on any XIAO ESP32-S3 or S3 Plus orb.
; It replaces the app over USB:  pio run -e displaytest -t upload
; Back up first (esptool read_flash 0 0x800000) and write that back afterwards.
[env:displaytest]
platform = espressif32 @ 7.0.1 ; pinned: 8.0.0 (Arduino core 3.x) broke the build 2026-10-19 - WiFiUDP, FS
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.partitions = partitions.csv
framework = arduino
build_src_filter = -<*> +<displaytest/>
lib_deps =
	bodmer/TFT_eSPI@^2.5.43
build_flags =
	-D DISPLAY_TEST
	-D DISABLE_ALL_LIBRARY_WARNINGS
	-D USER_SETUP_LOADED=1
	-D GC9A01_DRIVER
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=9
	-D TFT_MISO=-1
	-D TFT_SCLK=7
	-D TFT_CS=10
	-D TFT_DC=8
	-D TFT_RST=-1
	-D USE_HSPI_PORT
	-D LOAD_GLCD
	-D LOAD_FONT2
	-D LOAD_FONT4
	-D SPI_FREQUENCY=27000000

; Host unit tests for pure logic (settings validation):  pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17 -I firmware/src/core/settings -I firmware/src/core/wifi -I firmware/src/widgets/weatherwidget -I firmware/src/widgets/webdatawidget -I firmware/src/widgets/mqttwidget
lib_deps = bblanchon/ArduinoJson@^7.0.4
