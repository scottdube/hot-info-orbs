; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Bare `pio run` (CI, the VS Code build button) builds the firmware only. The
; native env holds host unit tests and cannot compile firmware/src - run it
; with `pio test -e native`.
default_envs = xiao-esp32s3, ota
src_dir = firmware/src
lib_dir = firmware/lib
include_dir = firmware/include

; Seeed XIAO ESP32-S3 or ESP32-S3 Plus on the hardware/hot-info-orbs-xiao
; carrier - interchangeable: identical D0-D10 pin map and user LED (Seeed wiki,
; checked 2026-10-14), 8 MB PSRAM both; only flash differs (8 vs 16 MB). This
; env builds for 8 MB with partitions.csv (two 3.75 MB app slots), so ONE
; binary runs on either module. A 16 MB build would use the Plus's extra flash and
; stop running on the plain S3 - not done.
; The board definition sets ARDUINO_USB_MODE / ARDUINO_USB_CDC_ON_BOOT itself:
; on the XIAO the native USB is the console (no UART bridge chip). The warning
; against those flags in docs/TRAPS.md was written for the v1.1 prototype.
[env:xiao-esp32s3]
platform = espressif32 @ 7.0.1 ; pinned: 8.0.0 (Arduino core 3.x) broke the build 2026-10-19 - WiFiUDP, FS
board = seeed_xiao_esp32s3
board_upload.flash_size = 8MB
board_build.embed_files = 
